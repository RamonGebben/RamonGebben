name: Character sheet

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/character-sheet.mjs, .github/workflows/character-sheet.yml]

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Roll the stats
        # PROFILE_TOKEN (a PAT with read:user) also counts private contributions; GITHUB_TOKEN sees public data only.
        env:
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
        run: node scripts/character-sheet.mjs RamonGebben
      - name: Commit if changed
        run: |
          git diff --quiet assets/character-sheet.svg && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/character-sheet.svg
          git commit -m 'chore: reroll character sheet'
          git push
